# Native Windows build with MSYS2 (MinGW-w64, UCRT64) and Qt 5.15.x.
# Builds a dynamic variant (exe + DLLs collected next to it) and a static
# variant (single exe, like the MXE cross build in build_win).
name: Windows build (MSYS2, Qt 5.15)

on:
  push:
    branches: [ci/windows-msys2]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.link }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - link: dynamic
            qmake: qmake-qt5
            packages: >-
              qt5-base qt5-declarative qt5-quickcontrols qt5-quickcontrols2
              qt5-graphicaleffects qt5-serialport qt5-connectivity qt5-gamepad
              qt5-svg qt5-3d qt5-tools
          - link: static
            qmake: /ucrt64/qt5-static/bin/qmake
            packages: qt5-static openssl
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make zip
          pacboy: toolchain:p ${{ matrix.packages }}

      - name: Show versions
        run: |
          ${{ matrix.qmake }} -v
          g++ --version | head -1

      - name: Build
        run: |
          ${{ matrix.qmake }} -config release "CONFIG+=release_win build_original"
          make -j$(nproc)
          rm -rf build/win/obj

      - name: Collect DLLs (dynamic)
        if: matrix.link == 'dynamic'
        run: |
          cd build/win
          # MSYS2 Qt uses desktop OpenGL, there is no ANGLE (libGLESv2.dll) to deploy.
          windeployqt-qt5 --release --compiler-runtime --no-angle --no-opengl-sw \
            --no-translations --qmldir ../.. vesc_tool_*.exe
          # windeployqt only knows about Qt itself; copy the other MSYS2
          # libraries (zlib, freetype, icu, ...) until nothing new shows up.
          while true; do
            missing=$({ find . \( -name '*.dll' -o -name '*.exe' \) -print0 \
              | xargs -0 ldd 2>/dev/null || true; } \
              | awk '$3 ~ /^\/ucrt64\// {print $3}' | sort -u \
              | while read -r f; do [ -e "$(basename "$f")" ] || echo "$f"; done)
            [ -z "$missing" ] && break
            cp $missing .
          done

      - name: Show dependencies
        run: |
          cd build/win
          ls -la vesc_tool_*.exe
          ldd vesc_tool_*.exe

      - name: Measure startup
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AMServiceEnabled, RealTimeProtectionEnabled | Format-List

          # Mark the introduction as done, the modal wizard would block the start checks.
          $key = 'HKCU:\Software\VESC\VESC Tool'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name intro_done -Value 'true' -PropertyType String -Force | Out-Null
          New-ItemProperty -Path $key -Name introVersion -Value 1 -PropertyType DWord -Force | Out-Null

          $exe = Get-ChildItem build/win/vesc_tool_*.exe | Select-Object -First 1
          $env:VT_STARTUP_TIMING = '1'

          for ($i = 1; $i -le 3; $i++) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo $exe.FullName
            $psi.WorkingDirectory = $exe.DirectoryName
            $psi.UseShellExecute = $false
            $psi.RedirectStandardError = $true

            $t0 = [DateTimeOffset]::Now.ToUnixTimeMilliseconds()
            $p = [System.Diagnostics.Process]::Start($psi)
            $deadline = (Get-Date).AddSeconds(120)
            $lines = @()
            while ($true) {
              $left = [int]($deadline - (Get-Date)).TotalMilliseconds
              if ($left -le 0) { $lines += '(timeout after 120 s)'; break }
              $task = $p.StandardError.ReadLineAsync()
              if (-not $task.Wait($left)) { $lines += '(timeout after 120 s)'; break }
              if ($null -eq $task.Result) { $lines += '(process exited)'; break }
              $lines += $task.Result
              if ($task.Result -match 'checkVersion done') { break }
            }
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2

            Write-Host "=== Run $i"
            foreach ($l in $lines) {
              if ($l -match '^STARTUP (\d+) (\d+) (.*)$') {
                Write-Host ('{0,8} ms since launch {1,8} ms since main  {2}' -f ([long]$matches[1] - $t0), $matches[2], $matches[3])
              } else {
                Write-Host "  $l"
              }
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: vesc_tool_windows_msys2_${{ matrix.link }}
          path: build/win/
